name: Tests

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['11.*', '12.*', '13.*']
        include:
          - laravel: '11.*'
            testbench: '^9.0'
          - laravel: '12.*'
            testbench: '^10.0'
          # Laravel 13 / Testbench 11 require PHP ^8.3 and resolve Pest 4.
          - laravel: '13.*'
            testbench: '^11.0'
        exclude:
          - php: '8.2'
            laravel: '13.*'

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite3, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      # Every Laravel 11 release is flagged by security advisories, so Composer's
      # resolver blocks them. Ignore only the advisories affecting v11.57.2 (taken
      # from Composer's resolver/audit output); any NEW advisory still fails the job.
      - name: Ignore known Laravel 11 advisories
        if: matrix.laravel == '11.*'
        run: >-
          composer config audit.ignore --json
          '["PKSA-yxbx-3c9s-cjt9","PKSA-d5tc-s1qs-h781","PKSA-m5cs-t1y6-qpcs","PKSA-3r5d-mb8f-1qw9","PKSA-mdq4-51ck-6kdq"]'

      - name: Require Testbench
        run: composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Execute tests
        run: vendor/bin/pest
